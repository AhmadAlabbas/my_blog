name: Verify and deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install test and build dependencies
        run: |
          python -m pip install -r source/requirements.txt
          npm install --prefix source --no-save --package-lock=false --no-audit --no-fund @php-wasm/node@3.1.54 @php-wasm/universal@3.1.54 playwright-core@1.64.0
      - name: Build and validate bilingual website
        working-directory: source
        run: |
          python build.py
          python build_hostinger.py
          python validate.py
          node tests/test-cms.mjs
      - name: Install test browser
        run: node source/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Check phone layouts on PHP pages
        working-directory: source
        run: |
          node ../tools/serve-php.mjs > "$RUNNER_TEMP/blog-rendering.log" 2>&1 &
          blog_server_pid=$!
          trap 'kill "$blog_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/ > /dev/null; then break; fi
            if ! kill -0 "$blog_server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/blog-rendering.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8001/ > /dev/null
          export CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')"
          node tests/mobile-layout.mjs
      - name: Prepare Hostinger update
        run: python tools/test_deployment.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hostinger-update
          path: artifacts/hostinger-update.tar.gz
          retention-days: 14
      - name: Deploy tested main branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.HOSTINGER_DEPLOY_ENABLED == 'true'
        env:
          HOSTINGER_SSH_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ vars.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          HOSTINGER_DEPLOY_PATH: ${{ vars.HOSTINGER_DEPLOY_PATH }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: bash tools/deploy_hostinger.sh
