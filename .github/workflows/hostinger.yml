name: Verify Node blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-root-password
          MYSQL_DATABASE: blog_node_ci_test
          MYSQL_USER: blog_ci
          MYSQL_PASSWORD: isolated-ci-app-password
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysql --protocol=tcp -h127.0.0.1 -ublog_ci -pisolated-ci-app-password -Dblog_node_ci_test -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install test and build dependencies
        run: npm ci
      - name: Build and validate bilingual website
        run: |
          npm run build
          npm test
      - name: Check MySQL persistence and migration
        env:
          TEST_MYSQL: '1'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '33306'
          MYSQL_DATABASE: blog_node_ci_test
          MYSQL_USER: blog_ci
          MYSQL_PASSWORD: isolated-ci-app-password
        run: npm test
      - name: Install test browser
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Check phone layouts on Node pages
        env:
          PUBLIC_URL: http://127.0.0.1:3000
          PORT: '3000'
          BLOG_TEST_BASE_URL: http://127.0.0.1:3000
        run: |
          export DATA_DIR="$RUNNER_TEMP/blog-data"
          node server.js > "$RUNNER_TEMP/blog-rendering.log" 2>&1 &
          blog_server_pid=$!
          trap 'kill "$blog_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then break; fi
            if ! kill -0 "$blog_server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/blog-rendering.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/health > /dev/null
          export CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')"
          npm run test:mobile
