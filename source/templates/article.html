<figure class="article-cover">{{COVER}}<figcaption>{{CAPTION}} · <a href="credits.html">Art credits</a></figcaption></figure>
<div class="wrap">
  <header class="article-heading reveal">
    <p class="eyebrow"><a href="{{CATEGORY_URL}}">{{CATEGORY}}</a> / {{KICKER}}</p>
    <h1>{{TITLE}}</h1>
    <p class="dek">{{SUBTITLE}}</p>
    <div class="byline"><span class="author-monogram" aria-hidden="true">AA</span><div><a href="about.html">Ahmad Alabbas</a><span class="meta">{{META}}</span></div></div>
  </header>
  <div class="reading-layout">
    <aside class="reading-aside" aria-label="Article contents"><div class="aside-inner"><span>In this note</span>{{TOC}}<a class="text-link" href="notes.html" style="margin-top:22px">All notes</a></div></aside>
    <article class="article-body" aria-label="{{TITLE}}">{{DISCLOSURE}}{{BODY}}{{SHARE}}</article>
  </div>
</div>

<section class="section wrap rule-top related-section"><div class="section-head"><div><p class="eyebrow">Keep exploring</p><h2>Related articles</h2></div><a class="text-link" href="articles.html">All articles</a></div><div class="card-grid">{{RELATED}}</div></section>
